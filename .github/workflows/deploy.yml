name: Veggofresh_backend


on:
  push:
    branches: main
  workflow_dispatch:


env:
  APP_NAME: vegfresh
  DEPLOY_PATH: /opt/vegfresh/backend/VEG-BACKEND
  SERVER_PASS: pVEpnfh@Ue2NSI3k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ env.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: DEPLOY_PATH,SERVER_PASS
          script: |
            set -e
            sudo su <<'EOF'
            cd /opt/vegfresh/backend/VEG-BACKEND
            chmod +x deploy.sh
            ./deploy.sh
            EOF
